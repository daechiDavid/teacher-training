name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Create OAuth resource from GitHub Secret
        shell: pwsh
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_OAUTH_JSON)) {
            throw "GOOGLE_OAUTH_JSON repository secret is required."
          }
          $oauthPath = Join-Path $env:GITHUB_WORKSPACE "src-tauri/google-oauth.json"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($oauthPath, $env:GOOGLE_OAUTH_JSON, $utf8NoBom)

      - name: Enable VBScript for WiX MSI bundling
        shell: pwsh
        run: |
          dism.exe /online /enable-feature /featurename:VBSCRIPT /all /norestart
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
            throw "Could not enable the Windows VBScript optional feature. DISM exit code: $LASTEXITCODE"
          }

      - name: Build Tauri Windows installers
        run: pnpm tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: teacher-training-windows-installers
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
